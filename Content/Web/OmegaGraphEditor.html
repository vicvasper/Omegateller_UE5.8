var ctxGraphX=0,ctxGraphY=0,ctxNodeId=null;

function showContextMenu(e, nodeId) {
  e.preventDefault(); e.stopPropagation();
  ctxGraphX = (e.clientX - cam.x) / cam.z;
  ctxGraphY = (e.clientY - cam.y) / cam.z;
  ctxNodeId = nodeId || null;
  var n = ctxNodeId ? nodes[ctxNodeId] : null;
  var html = '';

  if (n) {
    var nodeTitle = n.mergedChars && n.mergedChars.length > 1 ? n.mergedChars.join(' + ') : n.char;
    html += '<div class="ctx-header">' + nodeTitle + '</div>';
    html += '<div class="ctx-item repop-action" onclick="ctxRepopulate(' + n.id + ')">&#8635; Repopulate from here</div>';
    if (n.type === 'End') html += '<div class="ctx-item" onclick="ctxExportTimeline(' + n.id + ')">&#8615; Export this timeline</div>';
    html += '<div class="ctx-sep"></div>';
  }

  // Split options para nodos fusionados
  if (n && n.mergedChars && n.mergedChars.length > 1) {
    html += '<div class="ctx-header">Split off character</div>';
    n.mergedChars.forEach(function(cn) {
      if (cn === n.char) return;
      var ch = characters[cn];
      html += '<div class="ctx-item split-action" onclick="splitCharacterAt(' + n.id + ',\'' + cn.replace(/'/g, "\\'") + '\')"><span class="cdot" style="background:' + (ch ? ch.color : '#888') + '"></span>Split off ' + cn + ' ✂</div>';
    });
    html += '<div class="ctx-sep"></div>';
  }

  // NUEVO: Si hay beats importados en este timeline, mostrar opción de fusionar
  if (n && activeChar) {
    var importedBeats = [];
    for (var k in nodes) {
      var nd = nodes[k];
      if (nd.id !== n.id && nd.char === activeChar && nd.originalChar && nd.originalChar !== activeChar && nd.el.style.display !== 'none') {
        importedBeats.push(nd);
      }
    }
    if (importedBeats.length > 0) {
      html += '<div class="ctx-header">Fuse imported beat here</div>';
      importedBeats.forEach(function(ib) {
        var ch = characters[ib.originalChar];
        var col = ch ? ch.color : '#888';
        var label = (ib.name || ib.type).substring(0, 40);
        html += '<div class="ctx-item merge-action" onclick="fuseImportedBeat(' + n.id + ',' + ib.id + ')"><span class="cdot" style="background:' + col + '"></span>' + ib.originalChar + ': ' + label + '</div>';
      });
      html += '<div class="ctx-sep"></div>';
    }
  }

  // NUEVO: Si ESTE nodo es un beat importado, mostrar opción de fusionarlo con nodos locales
  if (n && n.originalChar && n.originalChar !== n.char) {
    var localNodes = [];
    for (var k in nodes) {
      var nd = nodes[k];
      if (nd.id !== n.id && nd.char === activeChar && !nd.originalChar && nd.type === 'Event' && nd.el.style.display !== 'none') {
        localNodes.push(nd);
      }
    }
    if (localNodes.length > 0) {
      html += '<div class="ctx-header">Fuse this into...</div>';
      localNodes.forEach(function(ln) {
        var label = (ln.name || ln.type).substring(0, 40);
        html += '<div class="ctx-item merge-action" onclick="fuseImportedBeat(' + ln.id + ',' + n.id + ')">' + ln.char + ': ' + label + '</div>';
      });
      html += '<div class="ctx-sep"></div>';
    }
  }

  html += '<div class="ctx-header">Add node</div>';
  html += '<div class="ctx-item" onclick="ctxAddNode(\'Event\')">+ Event</div>';
  html += '<div class="ctx-item" onclick="ctxAddNode(\'Decision\')">+ Decision</div>';
  html += '<div class="ctx-item" onclick="ctxAddNode(\'End\')">+ End</div>';

  // Insert character beat (desde espacio vacío)
  var charNames = Object.keys(characters);
  if (charNames.length > 1 && !n) {
    html += '<div class="ctx-sep"></div><div class="ctx-header">Insert character beat</div>';
    charNames.forEach(function(cname) {
      if (cname === activeChar) return;
      var ch = characters[cname]; var cids = ch.nodeIds; if (!cids.length) return;
      var secId = 'ctx_sec_' + cname.replace(/\W/g, '_');
      html += '<div class="ctx-char-header" onclick="document.getElementById(\'' + secId + '\').classList.toggle(\'open\')"><span class="cdot" style="background:' + ch.color + '"></span>' + cname + ' ▸</div>';
      html += '<div class="ctx-char-nodes" id="' + secId + '">';
      cids.forEach(function(sid) {
        var sn = nodes[sid]; if (!sn) return;
        var label = (sn.name || sn.type).substring(0, 32);
        html += '<div class="ctx-item" onclick="ctxInsertCharacterBeat(' + sid + ',\'' + cname.replace(/'/g, "\\'") + '\')"><span class="cdot" style="background:' + ch.color + '"></span>' + label + '</div>';
      });
      html += '</div>';
    });
  }

  // Merge timeline here (desde un nodo)
  if (charNames.length > 1 && n) {
    html += '<div class="ctx-sep"></div><div class="ctx-header">Merge timeline here</div>';
    charNames.forEach(function(cname) {
      if (cname === activeChar) return;
      var ch = characters[cname]; var cids = ch.nodeIds; if (!cids.length) return;
      var secId = 'ctx_secm_' + cname.replace(/\W/g, '_');
      html += '<div class="ctx-char-header" onclick="document.getElementById(\'' + secId + '\').classList.toggle(\'open\')"><span class="cdot" style="background:' + ch.color + '"></span>' + cname + ' ▸</div>';
      html += '<div class="ctx-char-nodes" id="' + secId + '">';
      cids.forEach(function(sid) {
        var sn = nodes[sid]; if (!sn) return;
        var label = (sn.name || sn.type).substring(0, 32);
        html += '<div class="ctx-item merge-action" onclick="mergeCharacterAt(' + n.id + ',\'' + cname.replace(/'/g, "\\'") + '\',' + sid + ')"><span class="cdot" style="background:' + ch.color + '"></span>' + label + '</div>';
      });
      html += '</div>';
    });
  }

  ctxMenu.innerHTML = html; ctxMenu.style.display = 'block';
  ctxMenu.style.left = e.clientX + 'px'; ctxMenu.style.top = e.clientY + 'px';
  var r = ctxMenu.getBoundingClientRect();
  if (r.right > window.innerWidth) ctxMenu.style.left = (window.innerWidth - r.width - 4) + 'px';
  if (r.bottom > window.innerHeight) ctxMenu.style.top = (window.innerHeight - r.height - 4) + 'px';
}

function getLinearChainForCharacter(charName){
  var chain=[],cur=null,visited={};
  for(var k in nodes){if(nodes[k].char===charName&&nodes[k].type==='Start'){cur=parseInt(k);break;}}
  if(cur===null)for(var k in nodes){if(nodes[k].char===charName){cur=parseInt(k);break;}}
  if(cur===null)return chain;
  while(cur!=null&&nodes[cur]){
    if(visited[cur])break;visited[cur]=true;chain.push(cur);
    var next=null;
    for(var i=0;i<nodes[cur].outputs.length;i++){
      var oid=nodes[cur].outputs[i];
      if(nodes[oid]&&nodes[oid].char===charName){next=oid;break;}
    }
    cur=next;
  }
  return chain;
}

function parseGDD() {
  var text = document.getElementById('gdd-text').value.trim();
  if (!text) return;

  detectNarrativeStyle(text);

  var btn = document.querySelector('#parse-panel .panel-footer .primary') ||
            document.querySelector('#parse-panel .primary');

    btn.disabled = true; 
    btn.innerText = 'Processing...'; 
  }

  var personInstr = getNarrativePrompt();   // POV global (por personaje se aplica en buildGraphFromData)
  var targetLang = langName();

  var prompt = `You are a LITERAL extractor of multi-POV narrative. DO NOT invent absolutely anything.

OUTPUT LANGUAGE (ABSOLUTE REQUIREMENT): the source text below is written in ${targetLang}.
Every single character name and every single beat MUST be written in ${targetLang}, reusing the
author's own words. Translating any part of the output is a failure, even if these instructions
are written in another language.

ORIGINAL TEXT:
"""${text}"""

MANDATORY RULES:
1. Identify ONLY characters that appear by name in the text.
2. Use EXCLUSIVELY events written in the original text, keeping their original wording in ${targetLang}.
3. DO NOT add emotions, objects or details that do not appear.
4. Each beat = exactly 1 short sentence (maximum 25 words).
5. Keep the beats of each character in the SAME ORDER they occur in the text, so each timeline
   reads as one continuous, coherent story instead of disconnected fragments.
6. ${personInstr}
7. DO NOT mix narrative persons within the same character timeline.
8. Narrate from the point of view of the character owner of each timeline.
   If a character X appears in Y's timeline, describe them from outside (from Y's perspective).

Respond ONLY with this exact JSON, without extra text, without markdown:

{
  "characters": [
    {"name": "ExactName1", "beats": ["sentence1", "sentence2", ...]},
    {"name": "ExactName2", "beats": ["sentence1", "sentence2", ...]}
  ]
}`;

  callAI(prompt, true, { validate: function(r) { return validateParsedGDD(r, text); } })
    .then(function(result) {
      if (btn) {
        btn.disabled = false;
        btn.innerText = 'Parse & Generate';
      }

      if (result && result.characters) {
        var valid = result.characters.filter(c => c && c.name && c.beats && c.beats.length >= 1);
        if (valid.length >= 1) {
          clearGraphInternal();
          pushUndo('import GDD');
          buildGraphFromData({ characters: valid });
          hideParsePanel();
          return;
        }
      }

      runFallbackParse(text);
    }).catch(function(e) {
      if (btn) {
        btn.disabled = false;
        btn.innerText = 'Parse & Generate';
      }
      runFallbackParse(text);
    });
}

// VALIDACIÓN DE LA RESPUESTA DE LA IA
// Una respuesta solo se acepta si (a) está en el idioma del texto original
// y (b) está anclada en el texto original (no inventada). Si no, se prueba
// el siguiente proveedor y, en último término, el parser literal.
function validateParsedGDD(result, sourceText) {
  if (!result || !result.characters || !result.characters.length) return false;

  var valid = result.characters.filter(function(c) {
    return c && typeof c.name === 'string' && c.name.trim() && c.beats && c.beats.length >= 1;
  });
  if (!valid.length) return false;

  var sourceLower = ' ' + foldAccents(String(sourceText).toLowerCase()).replace(/\s+/g, ' ') + ' ';

  // (a) los nombres deben existir en el texto
  for (var i = 0; i < valid.length; i++) {
    var n = foldAccents(String(valid[i].name).toLowerCase().trim());
    if (n.length < 2 || sourceLower.indexOf(n) < 0) {
      console.log('[AI] validación: el personaje "' + valid[i].name + '" no aparece en el texto');
      return false;
    }
  }

  var allBeats = [];
  valid.forEach(function(c) {
    c.beats.forEach(function(b) { if (typeof b === 'string' && b.trim()) allBeats.push(b.trim()); });
  });
  if (allBeats.length < 2) return false;

  // (b) idioma: el resultado debe estar en el mismo idioma que el original
  if (!isSameLanguage(allBeats.join(' '))) {
    console.log('[AI] validación: la respuesta cambió de idioma (se esperaba ' + narrativeLanguage + ')');
    return false;
  }

  // (c) anclaje: las palabras significativas deben venir del texto original
  var known = 0, total = 0;
  allBeats.forEach(function(b) {
    (foldAccents(b.toLowerCase()).match(/[a-z0-9']{4,}/g) || []).forEach(function(w) {
      total++;
      if (sourceLower.indexOf(w) >= 0) known++;
    });
  });
  var grounding = total ? known / total : 0;
  if (grounding < 0.6) {
    console.log('[AI] validación: respuesta poco anclada en el texto (' + Math.round(grounding * 100) + '%)');
    return false;
  }

  console.log('[AI] validación OK: ' + valid.length + ' personajes, ' + allBeats.length +
              ' beats, anclaje ' + Math.round(grounding * 100) + '%');
  return true;
}

function runFallbackParse(text) {
  clearGraphInternal();

  var extracted = fallbackExtract(text);
  if (!extracted.chars || !extracted.chars.length) {

  }
  if (extracted.chars && extracted.chars.length) {
    console.log('[OmegaTeller] Fallback: ' + extracted.chars.length + ' characters');
    buildGraphFromData({ characters: extracted.chars });
  } else {
    console.log('[OmegaTeller] No characters found at all');
  }
  hideParsePanel();
}

window.receiveParsedGDD = function(jsonData) {
  console.log("Rork Data Received:", jsonData);
  window._rorkWaitingForResponse = false;
  if (window._rorkResponseTimer) clearTimeout(window._rorkResponseTimer);
  
  hideParsePanel(); // Cerramos el panel de importación

  try {
    // Si Unreal lo manda como string, lo parseamos
    var data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
    
    if (!data.characters) return;

    pushUndo('Parse GDD with Rork');
    var globalNodeCount = 0;

    coherence.suppress++;
    try {
    data.characters.forEach(function(charEntry, charIdx) {
      var charName = charEntry.name;
      var lastNodeId = null;

      // Si el personaje no existe, lo creamos dinámicamente
      if (!characters[charName]) {
          addCharacterTab(charName);
      }

      charEntry.beats.forEach(function(rawBeat) {
        var beatText = "";
        
        // FIX PARA EL DOBLE JSON:
        try {
          var inner = JSON.parse(rawBeat);
          beatText = inner.text || rawBeat;
        } catch(e) { beatText = rawBeat; }

        // FILTRO PARA "JOHN" (Instrucciones alucinadas)
        if (beatText.includes("DO NOT summarize") || beatText.includes("requirements")) return;

        // SOLUCIÓN AL "SOLO 2 NODOS": 
        // Dividimos el párrafo gigante en frases individuales
        var sentences = beatText.split(/[.!?]+(?=\s|$)/).filter(s => s.trim().length > 15);

        sentences.forEach(function(sentenceText) {
          var finalContent = cleanNodeText(sentenceText);
          if (!finalContent) return;

          // Posicionamiento en cascada
          var x = 100 + (globalNodeCount * 260);
          var y = 150 + (charIdx * 250);

          var nid = addNode('Event', finalContent, x, y, charName);
          
          // Conectamos con el nodo anterior del mismo personaje
          if (lastNodeId !== null) {
            connectNodes(lastNodeId, nid);
          }
          
          lastNodeId = nid;
          globalNodeCount++;
        });
      });
    });
    } finally { coherence.suppress--; }

    setTimeout(fitView, 500);
    updateStatus();

  } catch (e) {
    console.error("Error en receiveParsedGDD:", e);
  }
};

function buildGraphFromData(data) {
  var chars = data.characters || [];
  if (!chars.length) return;

  // Si los beats no vienen de parseGDD (p. ej. llegan desde C++), el idioma de
  // todo lo generado se toma igualmente del contenido recibido.
  if (!langDetectedFromSource) {
    var sample = [];
    chars.forEach(function(c) { if (c && c.beats) sample = sample.concat(c.beats); });
    if (sample.length) {
      narrativeLanguage = detectLanguage(sample.join(' '));
      langDetectedFromSource = true;
      console.log('[OmegaTeller] Idioma deducido de los beats: ' + narrativeLanguage);
      refreshAllNodeHeaders();
    }
  }

  var wasRecording = editorHistory._recording;
  editorHistory._recording = false;
  chars.forEach(c => {
    if (c && c.name && !characters[c.name]) addCharacterTab(c.name);
  });
  editorHistory._recording = wasRecording;

  // La importación construye el grafo entero: no tiene sentido pedir
  // coherencia nodo a nodo mientras se monta.
  suppressCoherence(function() {
    chars.forEach(function(c) {
      if (!c || !c.name) return;
      var charName = c.name;

      activeChar = charName;
      document.querySelectorAll('.char-tab').forEach(t => t.classList.remove('active'));
      var tab = document.querySelector('.char-tab[data-char="' + charName + '"]');
      if (tab) tab.classList.add('active');
      refreshVisibility();

      var beats = (c.beats || []).map(b => cleanNodeText(typeof b === 'string' ? b.trim() : '')).filter(t => t.length > 3);

      if (beats.length === 0) return;

      // Registrar POV específico de este personaje a partir de sus beats
      registerCharacterPOV(charName, beats);

      var startId = addNode('Start', charName, 0, 0, charName);
      var prevId = startId;

      beats.forEach(sb => {
        var nid = addNode('Event', sb, 0, 0, charName);
        var newTa = nodes[nid].el.querySelector('textarea');
        if (newTa) autoResizeTextarea(newTa);
        connectNodes(prevId, nid);   // conexión forzada
        prevId = nid;
      });

      var endId = addNode('End', '', 0, 0, charName);
      connectNodes(prevId, endId);   // End siempre conectado

      autoLayout();
    });
  });

  var firstName = chars[0] ? chars[0].name : null;
  if (firstName) {
    var firstTab = document.querySelector('.char-tab[data-char="' + firstName + '"]');
    if (firstTab) switchCharacter(firstName, firstTab);
  }

  updateStatus();
}

// Nueva función para limpiar beats contaminados
function cleanBeatText(beat){
  if(!beat)return '';
  
  // Si es string, limpiar directamente
  if(typeof beat==='string'){
    var cleaned=beat;
    
    // Eliminar JSON completo incrustado
    cleaned=cleaned.replace(/^\{[^}]*\}/, '');
    
    // Eliminar campos JSON específicos
    cleaned=cleaned.replace(/\\\"text\\\":\\\"([^\\"]*)\\\"/g, '$1');
    cleaned=cleaned.replace(/\\\"task\\\":\\\"[^\\"]*\\\"/g, '');
    cleaned=cleaned.replace(/\\\"instructions\\\":\\\"[^\\"]*\\\"/g, '');
    cleaned=cleaned.replace(/\\\"requirements\\\":\\{[^}]*\\}/g, '');
    cleaned=cleaned.replace(/\\\"examples\\\":\\[[^\\]]*\\]/g, '');
    cleaned=cleaned.replace(/\\\"[^\\]*\\\"/g, '');
    cleaned=cleaned.replace(/\\\"[^\\]*\\\"/g, '');
    cleaned=cleaned.replace(/\\{[^}]*\\}/g, '');
    
    // Eliminar instrucciones residuales
    cleaned=cleaned.replace(/Each beat should be 1-2 sentences[^.]*\./g, '');
    cleaned=cleaned.replace(/focusing on what THAT character experiences[^.]*\./g, '');
    cleaned=cleaned.replace(/DO NOT summarize[^.]*\./g, '');
    cleaned=cleaned.replace(/CRITICAL:[^.]*/g, '');
    cleaned=cleaned.replace(/Generate SEPARATE[^.]*/g, '');
    
    // Limpiar caracteres de escape
    cleaned=cleaned.replace(/\\n/g, ' ');
    cleaned=cleaned.replace(/\\"/g, '"');
    cleaned=cleaned.replace(/\\\\/g, '\\');
    
    return cleaned.trim();
  }
  
  // Si es objeto JSON, extraer el campo text
  if(typeof beat==='object' && beat.text){
    return beat.text;
  }
  
  return beat.toString();
}

// Nueva función para dividir párrafos largos en beats individuales
function splitLongBeat(beat) {
  if (!beat) return [];
  beat = beat.trim();
  if (!beat) return [];

  // Si es razonablemente corta, devolver tal cual
  if (beat.length <= 150) return [beat];

  // Dividir por punto seguido (no punto final)
  var parts = beat.split(/\.(?=\s+[A-ZÁÉÍÓÚÑ])/);
  var result = [];
  parts.forEach(function(p) {
    var trimmed = p.trim();
    // Re-añadir punto si se quitó al split
    if (trimmed.length > 8) {
      if (!trimmed.match(/[.!?]$/)) trimmed += '.';
      result.push(trimmed);
    }
  });

  if (result.length > 1) return result;

  // Si no se pudo dividir por puntos, intentar por punto y coma o "y"
  parts = beat.split(/[;]\s*/);
  result = [];
  parts.forEach(function(p) {
    if (p.trim().length > 10) result.push(p.trim());
  });

  return result.length > 1 ? result : [beat];
}

function fallbackParseGDD(text){
  console.log('[OmegaBrowser] Using improved fallback parsing...');
  coherence.suppress++;
  try { fallbackParseGDDInternal(text); } finally { coherence.suppress--; }
}

function fallbackParseGDDInternal(text){
  
  // Extraer personajes usando el formato correcto del markdown
  var lines = text.split('\n');
  var characters = [];
  var currentChar = null;
  var charBeats = {};
  
  // Paso 1: Extraer personajes definidos con ###
  lines.forEach(function(line) {
    var trimmed = line.trim();
    if (trimmed.startsWith('### ')) {
      var charName = trimmed.substring(4).trim();
      if (charName && !charName.includes('Characters') && !charName.includes('Story') && !charName.includes('Beats')) {
        characters.push(charName);
        charBeats[charName] = [];
        currentChar = charName;
      }
    }
  });
  
  // Paso 2: Extraer beats por sección de personaje
  currentChar = null;
  lines.forEach(function(line) {
    var trimmed = line.trim();
    
    // Detectar sección de personaje con ## o ###
    if (trimmed.startsWith('## ') || trimmed.startsWith('### ')) {
      var sectionName = trimmed.replace(/^## |### /, '').trim();
      if (characters.includes(sectionName)) {
        currentChar = sectionName;
      } else {
        currentChar = null;
      }
    }
    
    // Extraer beats numerados
    if (currentChar && trimmed.match(/^\d+[\.\)]\s/)) {
      var beat = trimmed.replace(/^\d+[\.\)]\s*/, '').trim();
      if (beat && charBeats[currentChar]) {
        charBeats[currentChar].push(beat);
      }
    }
  });
  
  console.log('[OmegaBrowser] Fallback extracted characters:', characters);
  console.log('[OmegaBrowser] Fallback beats per character:', charBeats);
  
  // Crear el grafo con los datos extraídos
  if (characters.length === 0) {
    console.warn('[OmegaBrowser] No characters found, using basic parsing');
    // Fallback ultra-básico si no se encuentran personajes
    var sentences = text.split(/[.!?]+/).filter(function(s){ return s.trim().length > 10; });
    sentences.forEach(function(sentence, idx) {
      var content = sentence.trim();
      var nid = addNode('Event', content, 100 + (idx * 250), 100, 'Unknown');
      if (idx > 0) {
        connectNodes(parseInt(nid) - 1, parseInt(nid));
      }
    });
    updateStatus();
    return;
  }
  
  // Construir grafo con timelines individuales por personaje
  characters.forEach(function(charName) {
    addCharacterTab(charName);
    var prev = addNode('Start', charName, 0, 0, charName);
    
    var beats = charBeats[charName] || [];
    
    // Si no hay beats para este personaje, crear beats básicos basados en mención
    if (beats.length === 0) {
      // Buscar menciones del personaje en el texto
      var charMentions = [];
      lines.forEach(function(line, idx) {
        if (line.toLowerCase().includes(charName.toLowerCase()) && line.trim().length > 20) {
          var mention = line.trim().replace(/^\d+[\.\)]\s*/, '').replace(/^[-*]\s*/, '');
          if (mention.length > 15 && mention.length < 200) {
            charMentions.push(mention);
          }
        }
      });
      
      // Limitar a 5 beats como máximo por personaje
      charMentions.slice(0, 5).forEach(function(mention) {
        var nid = addNode('Event', cleanNodeText(mention), 0, 0, charName);
        connectNodes(prev, nid);
        prev = nid;
      });
    } else {
      // Usar beats extraídos normalmente
      beats.forEach(function(beat) {
        var nid = addNode('Event', cleanNodeText(beat) || '', 0, 0, charName);
        connectNodes(prev, nid);
        prev = nid;
      });
    }
  });
  
  // Seleccionar primer personaje
  if (characters.length > 0) {
    var firstTab = document.querySelector('.char-tab[data-char="' + characters[0] + '"]');
    if (firstTab) switchCharacter(characters[0], firstTab);
    autoLayout();
  }
  
  updateStatus();
  console.log('[OmegaBrowser] Fallback parsing completed with', characters.length, 'characters');
}

// Vocabulario de sección: un encabezado que contenga cualquiera de estas
// palabras describe una parte del documento, no a un personaje.
var SECTION_WORDS = {};
('story stories beat beats point points note notes narrative technical design ' +
 'mechanic mechanics gameplay overview structure system systems rule rules setting ' +
 'world worlds plot synopsis chapter section part parts act acts scene scenes ' +
 'character characters cast quest quests level levels item items enemy enemies ' +
 'ending endings branch branching timeline arc summary intro introduction ' +
 'conclusion epilogue prologue lore background objective objectives decision decisions ' +
 'project document example reference appendix index credits ' +
 'historia trama personaje personajes capitulo capitulos parte partes acto actos ' +
 'escena escenas nota notas mecanica mecanicas resumen estructura sistema sistemas ' +
 'ambientacion mundo argumento sinopsis introduccion conclusion epilogo prologo ' +
 'objetivo objetivos decision decisiones nivel niveles mision misiones proyecto documento'
).split(/\s+/).forEach(function(w) { if (w) SECTION_WORDS[w] = true; });

// Convierte un encabezado en nombre de personaje, o devuelve null si el
// encabezado es en realidad un título de capítulo o de sección
// ("II. Elena, 03:17", "Main Story Beats", "El reloj que perdió una hora").
var SECTION_PREFIX_RE = /^(cap[íi]tulo|chapter|parte|part|acto|act|escena|scene|decisi[óo]n|decision|nivel|level|fase|phase|misi[óo]n|mission|quest)\b/i;

function headerToCharacterName(rawHeader) {
  var header = stripInlineMarkdown(rawHeader);
  // "Act 1: The Scout's Calling" / "Decisión 2: ..." son secciones, no personajes
  if (SECTION_PREFIX_RE.test(header)) return null;

  var name = header
    .replace(/^([IVXLCDM]+|\d+)\s*[.)\-–—:]\s*/i, '')
    .split(/\s+[—–]\s+/)[0]          // "Elena - 03:17" -> "Elena"
    .replace(/[.,;:!?]+$/, '')
    .trim();
  if (name.length < 2 || name.length > 30) return null;
  if (/\d/.test(name)) return null;
  var words = name.split(/\s+/);
  if (words.length > 4) return null;                   // es una frase, no un nombre
  if (!/^[A-ZÁÉÍÓÚÜÑ]/.test(name)) return null;
  for (var i = 0; i < words.length; i++) {
    if (SECTION_WORDS[foldAccents(words[i].toLowerCase().replace(/[^\wÀ-ÿ]/g, ''))]) return null;
  }
  return name;
}

// Ficha de personaje ("- **Role**: Protagonist"), no un beat de la historia
var ATTR_KEY_RE = /^(Role|Rol|Age|Edad|Description|Descripci[óo]n|Personalidad|Personality|Goals?|Objetivos?|Motivaci[óo]n|Motivation|Background|Trasfondo|Arc|Arco|Appearance|Aspecto|Weakness|Debilidad|Strength|Fortaleza|Alignment|Class|Clase|Race|Raza|Species|Especie|Gender|G[ée]nero|Occupation|Oficio|Title|T[íi]tulo|Weapon|Arma|Ability|Habilidad|Name|Nombre|Traits?|Rasgos?)\s*[:：]/i;

// Honoríficos: no sirven para identificar a quién menciona un beat
var HONORIFICS = { lord:1, lady:1, sir:1, dame:1, king:1, queen:1, prince:1, princess:1,
  captain:1, doctor:1, master:1, mister:1, miss:1, don:1, dona:1, senor:1, senora:1,
  rey:1, reina:1, principe:1, princesa:1, capitan:1, doctor_es:1, maestro:1, maestra:1 };

// Alias utilizables para detectar a quién menciona un beat suelto
function characterAliases(fullName) {
  var aliases = [fullName];
  fullName.split(/\s+/).forEach(function(tok) {
    var clean = tok.replace(/[^\wÀ-ÿ'’-]/g, '');
    if (clean.length >= 4 && !HONORIFICS[foldAccents(clean.toLowerCase())] && aliases.indexOf(clean) < 0) {
      aliases.push(clean);
    }
  });
  return aliases;
}

// GDD estructurado: personajes declarados como encabezados con sus beats debajo.
// Se prueban los niveles #### → ### → ## y gana el primero que produzca
// personajes CON beats. Devuelve vacío si el documento es prosa libre.
function fallbackExtract(text) {
  var lines = text.split('\n');
  var SECTION_EXCLUDE = /^#{2,4}\s*(Characters|Story|Beats|Gameplay|Setting|World|Plot|Synopsis|Personajes|Historia|Trama|Story Beats)/i;

  function extractAtLevel(level) {
    var hashes = new RegExp('^#{' + level + '}(?!#)\\s+');
    var anyHeader = /^#{1,6}\s+/;
    var chars = [], charMap = {}, headerNames = {};

    // PASO 1: candidatos a personaje en los encabezados de este nivel
    lines.forEach(function(line) {
      var t = line.trim();
      if (!hashes.test(t) || SECTION_EXCLUDE.test(t)) return;
      var raw = t.replace(hashes, '').trim();
      var name = headerToCharacterName(raw);
      if (!name) return;
      headerNames[raw] = name;
      if (!charMap[name]) {
        charMap[name] = { name: name, beats: [], aliases: characterAliases(name) };
        chars.push(charMap[name]);
      }
    });
    if (!chars.length) return [];

    // PASO 2: beats por sección
    var currentSection = null;
    lines.forEach(function(line) {
      var t = line.trim();
      if (anyHeader.test(t)) {
        var raw = t.replace(anyHeader, '').trim();
        // el encabezado abre la sección de un personaje sólo si ese encabezado
        // dio lugar a un personaje en el PASO 1
        currentSection = (headerNames[raw] && charMap[headerNames[raw]]) ? headerNames[raw] : null;
        return;
      }
      if (/^\d+[.)]\s/.test(t)) {
        var numbered = t.replace(/^\d+[.)]\s*/, '').trim();
        if (!numbered || numbered.length < 5) return;
        if (currentSection) {
          charMap[currentSection].beats.push(numbered);
        } else {
          // beat bajo una sección genérica ("Act 1"): pertenece al personaje
          // que menciona primero, por nombre completo o por apellido/nombre
          var lower = foldAccents(numbered.toLowerCase());
          var owner = null, bestPos = Infinity;
          chars.forEach(function(c) {
            c.aliases.forEach(function(alias) {
              var pos = lower.indexOf(foldAccents(alias.toLowerCase()));
              if (pos >= 0 && pos < bestPos) { bestPos = pos; owner = c.name; }
            });
          });
          if (owner) charMap[owner].beats.push(numbered);
        }
        return;
      }
      if (t.indexOf('- ') === 0 && currentSection) {
        var bullet = stripInlineMarkdown(t.substring(2));
        if (bullet.length > 5 && !ATTR_KEY_RE.test(bullet)) charMap[currentSection].beats.push(bullet);
      }
    });

    return chars.filter(function(c) { return c.beats.length > 0; });
  }

  var chars = [];
  for (var level = 4; level >= 2 && !chars.length; level--) chars = extractAtLevel(level);

  console.log('[OmegaTeller] fallbackExtract: ' + chars.length + ' personajes con beats estructurados');
  return { chars: chars };
}
// PARSER LITERAL DE PROSA
// Extrae líneas de tiempo por personaje respetando el ORDEN del texto y
// la CONTINUIDAD de cada escena. No inventa nada y no traduce nada: cada

var PROSE_STOPSET = {};
PROSE_STOPWORDS.forEach(function(w) { if (w) PROSE_STOPSET[w] = true; });

function foldAccents(s) {
  return String(s || '')
    .replace(/[áàäâã]/g, 'a').replace(/[éèëê]/g, 'e').replace(/[íìïî]/g, 'i')
    .replace(/[óòöôõ]/g, 'o').replace(/[úùüû]/g, 'u').replace(/ñ/g, 'n').replace(/ç/g, 'c');
}
function isStopWord(word) { return !!PROSE_STOPSET[foldAccents(String(word).toLowerCase())]; }

// Quita el marcado inline conservando el texto tal cual lo escribió el autor
function stripInlineMarkdown(s) {
  if (!s) return '';
  return String(s)
    .replace(/`{1,3}([^`]*)`{1,3}/g, '$1')
    .replace(/\*\*\*([^*]+)\*\*\*/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/(^|[\s(¡¿"'])\*([^*\n]+)\*/g, '$1$2')
    .replace(/(^|[\s(¡¿"'])_([^_\n]+)_/g, '$1$2')
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

// Divide el documento en escenas usando encabezados markdown y separadores
function segmentScenes(text) {
  var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  var scenes = [], cur = { title: '', lines: [] };
  lines.forEach(function(raw) {
    var t = raw.trim();
    if (!t) return;
    if (/^([-*_=]\s*){3,}$/.test(t)) {                       // --- / *** / ___
      if (cur.lines.length) { scenes.push(cur); cur = { title: '', lines: [] }; }
      return;
    }
    var h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      if (cur.lines.length) scenes.push(cur);
      cur = { title: stripInlineMarkdown(h[2]), lines: [] };
      return;
    }
    cur.lines.push(t);
  });
  if (cur.lines.length) scenes.push(cur);
  return scenes;
}

var PROSE_ABBR = /(^|\s)(sr|sra|srta|dr|dra|mr|mrs|ms|st|prof|etc|vs|ej|p\.?\s?ej|no|núm|num|fig|cap)\.$/i;

// Segmentación de frases sin lookbehind (compatible con el CEF de UE) y sin
// romper horas (03:17), iniciales ni abreviaturas.
function splitProseSentences(line) {
  var text = stripInlineMarkdown(
    String(line || '')
      .replace(/^>\s?/, '')
      .replace(/^[-*+]\s+/, '')
      .replace(/^\d+[.)]\s+/, '')
  );
  if (!text) return [];

  var out = [], cur = '';
  for (var i = 0; i < text.length; i++) {
    cur += text[i];
    if ('.!?…'.indexOf(text[i]) < 0) continue;
    while (i + 1 < text.length && '.!?…»”"\')]'.indexOf(text[i + 1]) >= 0) cur += text[++i];
    var next = text[i + 1];
    if (next !== undefined && !/\s/.test(next)) continue;   // 3.14, www.x.y
    var trimmed = cur.trim();
    if (/(^|\s)[A-ZÁÉÍÓÚÑ]\.$/.test(trimmed)) continue;      // inicial "J."
    if (PROSE_ABBR.test(trimmed)) continue;                  // abreviatura
    if (trimmed) out.push(trimmed);
    cur = '';
  }
  if (cur.trim()) out.push(cur.trim());
  return out.filter(function(s) { return s.replace(/[^\wÀ-ÿ]/g, '').length > 1; });
}

// Detecta personajes exigiendo que el nombre actúe como SUJETO de alguna frase.
// Eso descarta los falsos positivos clásicos (topónimos, adverbios en mayúscula
// al inicio de frase, "Era", "Dentro", "Todos"...).
function detectProseCharacters(scenes) {
  // Mínimo 3 caracteres: descarta preposiciones capitalizadas al abrir frase
  var NAME_RE = /^[A-ZÁÉÍÓÚÜÑ][a-záéíóúüñ'’-]{2,}$/;
  var stats = {};   // nombre corto -> { mentions, subjectHits, titleHits, longForms:{} }

  function bump(name, field, amount) {
    if (!stats[name]) stats[name] = { name: name, mentions: 0, subjectHits: 0, titleHits: 0, longForms: {} };
    stats[name][field] += (amount === undefined ? 1 : amount);
    return stats[name];
  }

  scenes.forEach(function(scene) {
    var pool = [];
    if (scene.title) pool.push({ text: scene.title, isTitle: true });
    scene.lines.forEach(function(line) {
      splitProseSentences(line).forEach(function(s) { pool.push({ text: s, isTitle: false }); });
    });

    pool.forEach(function(entry) {
      var tokens = entry.text.split(/[\s"“”«»(),;:—–\-]+/).filter(Boolean);

      // Posición de sujeto = primer token con contenido, saltando conjunciones y
      // adverbios de apertura ("Y Elena abrió...", "Entonces Tomás respondió...")
      var subjectIndex = 0;
      while (subjectIndex < tokens.length &&
             isStopWord(tokens[subjectIndex].replace(/[.!?…]+$/, ''))) subjectIndex++;

      for (var i = 0; i < tokens.length; i++) {
        var word = tokens[i].replace(/[.!?…]+$/, '');
        if (!NAME_RE.test(word) || isStopWord(word)) continue;

        // nombre compuesto: tokens capitalizados consecutivos ("Elena Voss")
        var full = word, j = i + 1;
        while (j < tokens.length) {
          var nxt = tokens[j].replace(/[.!?…]+$/, '');
          if (!NAME_RE.test(nxt) || isStopWord(nxt)) break;
          full += ' ' + nxt; j++;
        }

        var st = bump(word, 'mentions');
        if (full !== word) st.longForms[full] = (st.longForms[full] || 0) + 1;
        if (entry.isTitle) bump(word, 'titleHits');

        // sujeto: ocupa la posición de sujeto y va seguido de una palabra en
        // minúscula (el verbo)
        var after = tokens[j];
        if (!entry.isTitle && i === subjectIndex && after && /^[a-záéíóúüñ]/.test(after)) bump(word, 'subjectHits');

        i = j - 1;
      }
    });
  });

  var chars = Object.keys(stats)
    .map(function(k) { return stats[k]; })
    .filter(function(c) {
      if (c.titleHits > 0 && c.mentions >= 2) return true;          // nombrado en un encabezado
      return c.subjectHits >= 2 && c.mentions >= 3;                 // actúa como sujeto de forma estable
    })
    .sort(function(a, b) { return (b.subjectHits - a.subjectHits) || (b.mentions - a.mentions); })
    .slice(0, 8);

  // Alias: nombre corto + forma larga si el texto la usa ("Elena" / "Elena Voss")
  chars.forEach(function(c) {
    c.aliases = [c.name];
    Object.keys(c.longForms).forEach(function(lf) { if (c.aliases.indexOf(lf) < 0) c.aliases.push(lf); });
    c.aliases.sort(function(a, b) { return b.length - a.length; });
  });

  return chars;
}

// Personaje que abre la frase (sujeto) o, en su defecto, el primero mencionado
function proseSubjectOf(sentence, chars, subjectOnly) {
  var best = null, bestPos = Infinity;
  for (var i = 0; i < chars.length; i++) {
    for (var a = 0; a < chars[i].aliases.length; a++) {
      var pos = sentence.indexOf(chars[i].aliases[a]);
      if (pos < 0) continue;
      if (subjectOnly && pos > 2) continue;
      if (pos < bestPos) { bestPos = pos; best = chars[i].name; }
    }
  }
  return best;
}

// Agrupa frases consecutivas en beats legibles (sin cortar por la mitad ni
// dejar nodos de tres palabras). Texto literal, unido en orden.
// `chunks` es una lista de escenas: NUNCA se mezclan dos escenas en un beat.
function groupProseBeats(chunks, maxBeats) {
  function packChunk(sentences, minChars, maxSentences) {
    var beats = [], buf = [], len = 0;
    sentences.forEach(function(s) {
      buf.push(s); len += s.length + 1;
      if (len >= minChars || buf.length >= maxSentences) { beats.push(buf.join(' ')); buf = []; len = 0; }
    });
    if (buf.length) {
      // una cola muy corta se pega al beat anterior de LA MISMA escena
      if (beats.length && buf.join(' ').length < 40) beats[beats.length - 1] += ' ' + buf.join(' ');
      else beats.push(buf.join(' '));
    }
    return beats;
  }

  function pack(minChars, maxSentences) {
    var out = [];
    chunks.forEach(function(sentences) {
      if (sentences.length) out = out.concat(packChunk(sentences, minChars, maxSentences));
    });
    return out;
  }

  var minChars = 90, maxSentences = 3, beats = pack(minChars, maxSentences);
  while (beats.length > maxBeats && minChars < 700) {
    minChars = Math.round(minChars * 1.5);
    maxSentences += 2;
    beats = pack(minChars, maxSentences);
  }
  return beats;
}

function parseFreeProseText(text) {
  var scenes = segmentScenes(text);
  if (!scenes.length) return { chars: [] };

  var chars = detectProseCharacters(scenes);
  if (!chars.length) {
    console.log('[OmegaTeller] parseFreeProseText: no se detectó ningún personaje');
    return { chars: [] };
  }
  console.log('[OmegaTeller] parseFreeProseText personajes: ' +
    chars.map(function(c) { return c.name + '(m' + c.mentions + '/s' + c.subjectHits + ')'; }).join(', '));

  // Por personaje, una lista de escenas (cada escena = lista de frases en orden)
  var charScenes = {}, prominence = {};
  chars.forEach(function(c) {
    charScenes[c.name] = [];
    prominence[c.name] = c.subjectHits * 2 + c.mentions;
  });

  // Cada escena pertenece ENTERA a un POV: así la línea de tiempo mantiene
  // continuidad narrativa en lugar de saltar de frase suelta en frase suelta.
  var lastOwner = null;
  scenes.forEach(function(scene) {
    var sentences = [];
    scene.lines.forEach(function(line) {
      splitProseSentences(line).forEach(function(s) { sentences.push(s); });
    });
    if (!sentences.length) return;

    // 1) personaje nombrado en el encabezado de la escena
    var owner = scene.title ? proseSubjectOf(scene.title, chars, false) : null;

    // 2) personaje que más veces actúa como sujeto dentro de la escena.
    //    Los empates los rompe el protagonismo global, no el orden de aparición.
    if (!owner) {
      var score = {};
      sentences.forEach(function(s) {
        var subj = proseSubjectOf(s, chars, true);
        if (subj) score[subj] = (score[subj] || 0) + 1;
      });
      var bestScore = 0;
      Object.keys(score).forEach(function(k) {
        var weighted = score[k] + (prominence[k] || 0) * 1e-4;
        if (weighted > bestScore) { bestScore = weighted; owner = k; }
      });
    }

    // 3) primer personaje mencionado en la escena
    if (!owner) {
      for (var i = 0; i < sentences.length && !owner; i++) owner = proseSubjectOf(sentences[i], chars, false);
    }

    // 4) continuidad con la escena anterior
    if (!owner) owner = lastOwner;
    if (!owner || !charScenes[owner]) return;

    charScenes[owner].push(sentences);
    lastOwner = owner;
  });

  // Un personaje sin escena propia conserva, en orden, las frases donde actúa
  chars.forEach(function(c) {
    if (charScenes[c.name].length) return;
    scenes.forEach(function(scene) {
      var own = [];
      scene.lines.forEach(function(line) {
        splitProseSentences(line).forEach(function(s) {
          if (proseSubjectOf(s, chars, true) === c.name) own.push(s);
        });
      });
      if (own.length) charScenes[c.name].push(own);
    });
  });

  var result = chars
    .map(function(c) { return { name: c.name, beats: groupProseBeats(charScenes[c.name], 40) }; })
    .filter(function(c) { return c.beats.length > 0; });

  console.log('[OmegaTeller] parseFreeProseText resultado: ' +
    result.map(function(c) { return c.name + '(' + c.beats.length + ')'; }).join(', '));

  return { chars: result };
}


function clearGraphInternal(){
  coherence.pendingAnchors={};
  if(coherence.timer){clearTimeout(coherence.timer);coherence.timer=null;}
  setCoherenceStatus('');
  for(var k in connections)if(connections[k].el)connections[k].el.remove();
  for(var k in nodes)if(nodes[k].el)nodes[k].el.remove();
  nodes={};connections={};selected={};nextId=0;
  document.querySelectorAll('.char-tab').forEach(function(t){t.remove();});
  characters={};charIdx=0;activeChar=null;
  _mergeExecuted=false;
  updateStatus();
}
function clearGraph(){pushUndo('clear graph');clearGraphInternal();}

function fitView(){
  var keys=Object.keys(nodes).filter(function(k){return nodes[k].el.style.display!=='none';});
  if(!keys.length)return;
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  keys.forEach(function(k){
    var n=nodes[k],w=n.el.offsetWidth||NODE_W,h=n.el.offsetHeight||80;
    minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+w);maxY=Math.max(maxY,n.y+h);
  });
  var wrap=document.getElementById('canvas-wrap'),pad=80;
  var w=maxX-minX+pad*2,h=maxY-minY+pad*2;
  cam.z=Math.min(wrap.clientWidth/w,wrap.clientHeight/h,1.3);
  cam.z=Math.max(cam.z,0.15);
  cam.x=(wrap.clientWidth-(maxX+minX)*cam.z)/2;
  cam.y=(wrap.clientHeight-(maxY+minY)*cam.z)/2+20;
  applyCamera();
}

function updateStatus(){
  var nc=Object.keys(nodes).length,cc=Object.keys(connections).length;
  var label='Nodes: '+nc+' | Links: '+cc;
  if(activeChar)label=activeChar+' - '+label;
  var hu=editorHistory.undoStack.length,hr=editorHistory.redoStack.length;
  if(hu>0||hr>0)label+=' | History: '+hu+'/'+hr;
  if(coherence.status)label+=' | ⚯ '+coherence.status;
  document.getElementById('status').textContent=label;
  updateUndoButtons();
}

// GLOBAL MOUSE EVENTS
document.addEventListener('mousemove',function(e){
  if(drag.active&&drag.node){
    var n=drag.node;
    n.x=(e.clientX-cam.x)/cam.z-drag.ox;
    n.y=(e.clientY-cam.y)/cam.z-drag.oy;
    n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';
    updateAllConns();
  }

  if(conn.active&&conn.fromId!==null){
    var a=nodes[conn.fromId];if(!a)return;
    var p1=getPortOut(a);
    var rect=document.getElementById('canvas-wrap').getBoundingClientRect();
    var mx=(e.clientX-rect.left-cam.x)/cam.z;
    var my=(e.clientY-rect.top-cam.y)/cam.z;
    var dx=mx-p1.x,cpx=Math.max(Math.abs(dx)*0.45,50);
    tempConn.setAttribute('d','M'+p1.x+' '+p1.y+' C'+(p1.x+cpx)+' '+p1.y+','+(mx-cpx)+' '+my+','+mx+' '+my);
  }

  if(pan.active){
    cam.x+=e.clientX-pan.sx;cam.y+=e.clientY-pan.sy;
    pan.sx=e.clientX;pan.sy=e.clientY;
    applyCamera();
  }
});



document.addEventListener('mouseup', function(e) {
  if (drag.active && drag.node) {
    drag.node.el.classList.remove('dragging');
    hideCrossTimelineTargets();

    var moved = Math.abs(drag.node.x - drag.startX) > 4 || Math.abs(drag.node.y - drag.startY) > 4;
    if (moved) {
      var curX = drag.node.x, curY = drag.node.y;
      drag.node.x = drag.startX; drag.node.y = drag.startY;
      drag.node.el.style.left = drag.startX + 'px'; drag.node.el.style.top = drag.startY + 'px';
      pushUndo('move node');
      drag.node.x = curX; drag.node.y = curY;
      drag.node.el.style.left = curX + 'px'; drag.node.el.style.top = curY + 'px';
    }

    send('NODE_MOVE', drag.node.id + ':' + Math.round(drag.node.x) + ':' + Math.round(drag.node.y));

    if (!_mergeExecuted) {
      var gx = (e.clientX - cam.x) / cam.z;
      var gy = (e.clientY - cam.y) / cam.z;
      var targetNode = findNodeAtGraphPos(gx, gy, drag.node.id);

      if (targetNode && targetNode.id !== drag.node.id) {
        var sameChar = (drag.node.char === targetNode.char);
        var isImported = drag.node.originalChar && drag.node.originalChar !== drag.node.char;
        var targetIsImported = targetNode.originalChar && targetNode.originalChar !== targetNode.char;

        if (sameChar || e.altKey || isImported || targetIsImported) {
          _mergeExecuted = true;

          if (isImported || targetIsImported) {
            if (isImported) fuseImportedBeat(targetNode.id, drag.node.id);
            else fuseImportedBeat(drag.node.id, targetNode.id);
          } else {
            executeDirectMerge(drag.node, targetNode);
          }
        }
      }
    }

    drag.active = false;
    drag.node = null;
  }

  if (conn.active) {
    document.querySelectorAll('.port.active').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.omega-node.conn-target').forEach(function(n) { n.classList.remove('conn-target'); });
    if (conn.targetId !== null && conn.fromId !== null && conn.targetId !== conn.fromId) {
      pushUndo('connect');
      connectNodes(conn.fromId, conn.targetId);
    }
  }
  conn.active = false; conn.fromId = null; conn.targetId = null;
  tempConn.style.display = 'none';
  pan.active = false;
});

document.getElementById('canvas-wrap').addEventListener('mousedown',function(e){
  hideContextMenu();
  if(e.target===this||e.target.id==='nodes-layer'){
    if(e.button===1||e.shiftKey){pan.active=true;pan.sx=e.clientX;pan.sy=e.clientY;e.preventDefault();}
    else if(e.button===0){clearSel();}
  }
});

document.getElementById('canvas-wrap').addEventListener('contextmenu',function(e){
  var isCanvas=e.target===document.getElementById('canvas-wrap')||
               e.target===nodesEl||
               (e.target.closest&&e.target.closest('#nodes-layer')&&!e.target.closest('.omega-node'));
  if(isCanvas){e.preventDefault();showContextMenu(e,null);}
});

document.addEventListener('mousedown',function(e){
  if(!ctxMenu.contains(e.target))hideContextMenu();
});

document.addEventListener('keydown',function(e){
  /* Undo/Redo funciona también dentro de textareas */
  var inInput=e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT';
  if((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)&&!e.shiftKey){e.preventDefault();undo();return;}
  if((e.key==='y'||e.key==='Y')&&(e.ctrlKey||e.metaKey)){e.preventDefault();redo();return;}
  if((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)&&e.shiftKey){e.preventDefault();redo();return;}
  if(inInput)return;
  if(e.key==='Delete'||e.key==='Backspace'){
    var selKeys=Object.keys(selected);
    if(selKeys.length){pushUndo('delete nodes');selKeys.forEach(function(id){deleteNode(parseInt(id));});}
  }
  if(e.key==='a'&&(e.ctrlKey||e.metaKey)){e.preventDefault();for(var k in nodes)if(nodes[k].el.style.display!=='none')selectNode(parseInt(k));}
  if(e.key==='l'||e.key==='L')autoLayout();
});

document.getElementById('canvas-wrap').addEventListener('wheel',function(e){
  e.preventDefault();
  var rect=e.currentTarget.getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top,oldZ=cam.z;
  cam.z*=(e.deltaY>0)?0.92:1.08;
  cam.z=Math.max(0.1,Math.min(3,cam.z));
  cam.x=mx-(mx-cam.x)*(cam.z/oldZ);
  cam.y=my-(my-cam.y)*(cam.z/oldZ);
  applyCamera();
},{passive:false});

updateStatus();
</script>
</body>
