[OmegaAI]
; Backend de IA para la coherencia narrativa.
; Por defecto el plugin arranca su propio servidor local (llama.cpp) con el
; modelo incluido en ThirdParty/Models/*.gguf. Sin nube, sin coste, sin clave.
bAutoStartLocalServer=true
LocalPort=17811
; Nombre de modelo enviado en las peticiones (informativo para llama.cpp)
LocalModel=qwen2.5-1.5b-instruct
; Tamano de contexto del servidor local
ContextSize=4096
; Fichero .gguf concreto dentro de ThirdParty/Models (vacio = el primero que haya)
ModelFile=

; Conectarse a otro backend en vez del bundled, opcional.
; Cualquier endpoint OpenAI-compatible. Ejemplos:
;   Ollama:    LocalEndpoint=http://127.0.0.1:11434/v1/chat/completions  (+ LocalModel=llama3.2 y bAutoStartLocalServer=false)
;   LM Studio: LocalEndpoint=http://127.0.0.1:1234/v1/chat/completions   (+ bAutoStartLocalServer=false)
LocalEndpoint=

; APIs remotas opcionales, como fallback si el modelo local no responde.
; Las claves viven aqui, nunca dentro del HTML.
GeminiKey=
GeminiModel=gemini-2.0-flash-lite
GroqKey=
GroqModel=llama-3.1-8b-instant

[/Script/OmegaTellerPlugin.OmegaTellerManager]
; AI Configuration
AIType=Local
ModelPath=
MaxTokens=1000
Temperature=0.7

; Tree Generation
DefaultMaxBranches=5
DefaultMaxDepth=10
bAutoGenerateNodes=true
bValidateTreesOnCreate=true

; Visual Settings
DefaultNodeColor=(R=0.2,G=0.5,B=0.8,A=1.0)
StartNodeColor=(R=0.0,G=0.8,B=0.0,A=1.0)
EndNodeColor=(R=0.8,G=0.0,B=0.0,A=1.0)
DecisionNodeColor=(R=0.8,G=0.8,B=0.0,A=1.0)

; Editor Settings
bShowGrid=true
GridSize=32
SnapToGrid=true
bShowConnectionArrows=true

; Performance
MaxNodesPerTree=1000
bEnableCaching=true
CacheSizeMB=100